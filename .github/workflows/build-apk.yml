name: build-apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "sdkmanager at: $SDKM"
          echo "$SDKM" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDKM:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p apk assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          ls -l apk/app/build/outputs/apk/debug/
          cp apk/app/build/outputs/apk/debug/app-debug.apk kebiao.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kebiao-apk
          path: kebiao.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1
          name: 课表 APK
          body: 安卓安装包（首次安装需允许「未知来源」）
          files: kebiao.apk
