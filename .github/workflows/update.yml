name: update-schedule

on:
  schedule:
    - cron: "0 */4 * * *"   # 每 4 小时（UTC），北京时间 8/12/16/20 点等
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch & build ics
        env:
          ZUA_USER: ${{ secrets.ZUA_USER }}
          ZUA_PASS: ${{ secrets.ZUA_PASS }}
          ZUA_TERM_START: ${{ vars.ZUA_TERM_START }}
        run: python -m zua_kb.main --out docs/schedule.ics

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/schedule.ics
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: update schedule"
            git push
          fi
